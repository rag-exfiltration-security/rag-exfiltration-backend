services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-exfiltration-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_exfiltration
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: rag-exfiltration-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - rag_ollama_data:/root/.ollama
    # Si hay GPU NVIDIA disponible, descomentar para acelerar la inferencia:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  rag_postgres_data:
  rag_ollama_data:
